<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หลังบ้านแก้ไขเว็บ | KOONGTUNG</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark:#16181c; --red:#e2231a; --navy:#17356b; --cream:#faf7f2; --muted:#6b6459; --shadow:0 8px 24px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Kanit',sans-serif; background:var(--cream); color:#222; }
  header { background:var(--dark); color:#fff; padding:18px 24px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:1.2rem; margin:0; }
  header a { color:#f0c0bd; font-size:.85rem; }
  .wrap { max-width:1140px; margin:0 auto; padding:24px; }
  #gate { max-width:420px; margin:80px auto; background:#fff; padding:32px; border-radius:14px; box-shadow:var(--shadow); text-align:center; }
  #gate input { width:100%; padding:12px; font-size:1rem; border:1px solid #ddd; border-radius:8px; margin:14px 0; font-family:inherit; }
  #gate button, .save-btn, .reset-btn { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-family:inherit; font-size:.9rem; cursor:pointer; }
  .reset-btn { background:#888; margin-left:8px; }
  #gate button:hover, .save-btn:hover { opacity:.9; }
  #app { display:none; }
  .content-toolbar { margin-bottom:16px; }
  #contentSearch { width:100%; padding:13px 18px; border:1px solid #ddd; border-radius:12px; font-family:inherit; font-size:.95rem; box-shadow:var(--shadow); }
  #contentSearch:focus { outline:2px solid var(--navy); outline-offset:1px; }
  .content-layout { display:flex; gap:20px; align-items:flex-start; }
  .content-sidebar { flex:0 0 230px; position:sticky; top:16px; max-height:calc(100vh - 32px); overflow-y:auto; background:#fff; border-radius:14px; box-shadow:var(--shadow); padding:14px 8px; }
  .sidebar-list { list-style:none; margin:0; padding:0; }
  .sidebar-page-head { display:flex; align-items:center; gap:6px; font-weight:700; font-size:.78rem; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin:16px 0 4px; padding:4px 8px; border-left:3px solid #ccc; }
  .sidebar-page-head:first-child { margin-top:0; }
  .sidebar-link { display:block; padding:6px 8px 6px 18px; font-size:.84rem; color:#444; border-radius:6px; text-decoration:none; }
  .sidebar-link:hover { background:#f0ede7; color:var(--navy); }
  .content-groups { flex:1; min-width:0; }
  .group { background:#fff; border-radius:14px; box-shadow:var(--shadow); margin-bottom:16px; border-left:5px solid #ccc; overflow:hidden; scroll-margin-top:16px; }
  .group-header { display:flex; align-items:center; gap:10px; padding:16px 20px; cursor:pointer; user-select:none; }
  .group-header:hover { background:#faf9f7; }
  .group-icon { font-size:1.2rem; flex-shrink:0; }
  .group-header h2 { flex:1; font-size:1.05rem; margin:0; color:var(--navy); }
  .chevron { color:var(--muted); transition:transform .2s; flex-shrink:0; }
  .group.open .chevron { transform:rotate(180deg); }
  .group-body { display:none; padding:0 24px 20px; }
  .group.open .group-body { display:block; }
  @media (max-width:820px) {
    .content-layout { flex-direction:column; }
    .content-sidebar { position:static; width:100%; max-height:260px; }
  }
  .field { padding:16px 0; border-bottom:1px solid #f0ede7; }
  .field:last-child { border-bottom:none; }
  .field label { display:block; font-weight:600; margin-bottom:8px; font-size:.92rem; }
  .field textarea { width:100%; min-height:70px; padding:10px; border:1px solid #ddd; border-radius:8px; font-family:inherit; font-size:.95rem; resize:vertical; }
  .field input[type="text"] { width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-family:inherit; font-size:.9rem; }
  .field a.test-link { font-size:.8rem; color:var(--navy); margin-left:4px; }
  .field img { max-width:220px; max-height:140px; object-fit:cover; border-radius:8px; display:block; margin-bottom:10px; box-shadow:var(--shadow); }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:8px; }
  .status { font-size:.82rem; color:var(--muted); margin-left:4px; }
  .status.ok { color:#1a7a3c; }
  .status.err { color:var(--red); }
  .badge-changed { background:#fff3cd; color:#8a6400; font-size:.72rem; padding:2px 8px; border-radius:999px; margin-left:8px; }
  table.stats { width:100%; border-collapse:collapse; font-size:.92rem; }
  table.stats th, table.stats td { text-align:left; padding:8px 10px; border-bottom:1px solid #f0ede7; }
  table.stats th { color:var(--muted); font-weight:600; font-size:.8rem; text-transform:uppercase; }
  table.stats td.count { font-weight:700; color:var(--red); text-align:right; }
  .bar-bg { background:#f0ede7; border-radius:6px; height:8px; margin-top:4px; overflow:hidden; }
  .bar-fill { background:var(--navy); height:100%; }
  .tab-btns { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .tab-btns button { padding:10px 20px; border-radius:8px; border:none; font-family:inherit; cursor:pointer; background:#eee; font-weight:600; }
  .tab-btns button.active { background:var(--navy); color:#fff; }
  .gallery-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:12px; margin-bottom:16px; }
  .gallery-thumb { position:relative; border-radius:8px; overflow:hidden; box-shadow:var(--shadow); aspect-ratio:1; }
  .gallery-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-thumb .del-btn {
    position:absolute; top:4px; right:4px; background:rgba(0,0,0,.65); color:#fff; border:none;
    width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:.85rem; line-height:1;
  }
  .gallery-thumb .del-btn:hover { background:var(--red); }
  .gallery-add-tile {
    aspect-ratio:1; border:2px dashed #ccc; border-radius:8px; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:.82rem; text-align:center; cursor:pointer; position:relative; overflow:hidden;
  }
  .gallery-add-tile input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; }
</style>
</head>
<body>

<header>
  <h1>🛠 หลังบ้านแก้ไขเว็บ KOONGTUNG</h1>
  <a href="/" target="_blank">← กลับไปดูหน้าเว็บจริง</a>
</header>

<div id="gate">
  <h2>กรอกรหัสผ่านเพื่อเข้าใช้งาน</h2>
  <input type="password" id="pw" placeholder="รหัสผ่าน">
  <button onclick="tryLogin()">เข้าสู่ระบบ</button>
  <p id="gateMsg" class="status err"></p>
</div>

<div id="app" class="wrap">
  <div class="tab-btns">
    <button id="tabContentBtn" class="active" onclick="showTab('content')">✏️ แก้ไขเนื้อหา</button>
    <button id="tabLinksBtn" onclick="showTab('links')">🔗 จัดการลิงก์ทั้งหมด</button>
    <button id="tabCreatorBtn" onclick="showTab('creator')">🎬 รีวิวครีเอเตอร์</button>
    <button id="tabGalleryBtn" onclick="showTab('gallery')">🖼 แกลเลอรี่รูปภาพ</button>
    <button id="tabBlogBtn" onclick="showTab('blog')">📝 จัดการบทความ</button>
    <button id="tabLeadsBtn" onclick="showTab('leads')">📋 ข้อความติดต่อ</button>
    <button id="tabStatsBtn" onclick="showTab('stats')">📊 สถิติการคลิกลิงก์</button>
  </div>
  <div id="contentTab"></div>
  <div id="linksTab" style="display:none;"></div>
  <div id="creatorTab" style="display:none;"></div>
  <div id="galleryTab" style="display:none;"></div>
  <div id="blogTab" style="display:none;"></div>
  <div id="leadsTab" style="display:none;"></div>
  <div id="statsTab" style="display:none;"></div>
</div>

<script>
var PASSWORD = '';
var manifest = [];
var overrides = {};

function tryLogin() {
  var candidate = document.getElementById('pw').value;
  if (!candidate) return;
  var gateMsg = document.getElementById('gateMsg');
  gateMsg.textContent = 'กำลังตรวจสอบ...';
  gateMsg.className = 'status';
  fetch('/api/verify', {
    method: 'POST',
    headers: { 'x-admin-password': candidate }
  }).then(function (res) { return res.json().then(function (j) { return { status: res.status, ok: j.ok }; }); })
    .then(function (result) {
      if (result.ok) {
        PASSWORD = candidate;
        sessionStorage.setItem('koongtung_admin_pw', PASSWORD);
        boot();
      } else {
        gateMsg.textContent = 'รหัสผ่านไม่ถูกต้อง';
        gateMsg.className = 'status err';
      }
    }).catch(function () {
      gateMsg.textContent = 'เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง';
      gateMsg.className = 'status err';
    });
}

function resizeImage(file, cb) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var img = new Image();
    img.onload = function () {
      var maxW = 1920;
      var scale = Math.min(1, maxW / img.width);
      var canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL('image/jpeg', 0.82), img.width);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveField(id, value, statusEl) {
  statusEl.textContent = 'กำลังบันทึก...';
  statusEl.className = 'status';
  // Send our in-memory snapshot along with the change. KV reads are
  // eventually consistent, so if the server re-fetched "overrides" fresh on
  // every save, two saves made a few seconds apart could each read a stale
  // copy and the second one would silently erase the first. Our snapshot is
  // always current for this session, so the server uses it instead of
  // re-reading from KV.
  var merged = Object.assign({}, overrides);
  merged[id] = value;
  fetch('/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-password': PASSWORD },
    body: JSON.stringify({ id: id, value: value, overrides: merged })
  }).then(function (res) {
    if (res.status === 401) {
      statusEl.textContent = 'รหัสผ่านไม่ถูกต้อง — กรุณาโหลดหน้านี้ใหม่แล้วกรอกรหัสผ่านอีกครั้ง';
      statusEl.className = 'status err';
      sessionStorage.removeItem('koongtung_admin_pw');
      return;
    }
    return res.json();
  }).then(function (json) {
    if (json && json.ok) {
      statusEl.textContent = 'บันทึกแล้ว ✓ (เว็บจะอัปเดตทันที)';
      statusEl.className = 'status ok';
      overrides = merged;
    }
  }).catch(function () {
    statusEl.textContent = 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';
    statusEl.className = 'status err';
  });
}

function resetField(id, statusEl, defaultValue, refreshFn) {
  statusEl.textContent = 'กำลังคืนค่าเดิม...';
  var merged = Object.assign({}, overrides);
  delete merged[id];
  fetch('/api/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-password': PASSWORD },
    body: JSON.stringify({ id: id, overrides: merged })
  }).then(function (res) { return res.json(); })
    .then(function (json) {
      if (json && json.ok) {
        overrides = merged;
        statusEl.textContent = 'คืนค่าเดิมแล้ว ✓';
        statusEl.className = 'status ok';
        if (refreshFn) refreshFn(defaultValue);
      }
    });
}

function renderField(field) {
  var current = overrides.hasOwnProperty(field.id) ? overrides[field.id] : field.default;
  var wrap = document.createElement('div');
  wrap.className = 'field';

  var label = document.createElement('label');
  label.textContent = field.label;
  if (overrides.hasOwnProperty(field.id)) {
    var badge = document.createElement('span');
    badge.className = 'badge-changed';
    badge.textContent = 'แก้ไขแล้ว';
    label.appendChild(badge);
  }
  wrap.appendChild(label);

  if (field.hint) {
    var hintEl = document.createElement('div');
    hintEl.textContent = '📐 ' + field.hint;
    hintEl.style.fontSize = '.78rem';
    hintEl.style.color = 'var(--muted)';
    hintEl.style.marginBottom = '8px';
    wrap.appendChild(hintEl);
  }

  var statusEl = document.createElement('span');
  statusEl.className = 'status';

  if (field.type === 'text') {
    var textarea = document.createElement('textarea');
    textarea.value = current || '';
    wrap.appendChild(textarea);

    var row = document.createElement('div');
    row.className = 'row';
    var saveBtn = document.createElement('button');
    saveBtn.className = 'save-btn';
    saveBtn.textContent = 'บันทึก';
    saveBtn.onclick = function () { saveField(field.id, textarea.value, statusEl); };
    var resetBtn = document.createElement('button');
    resetBtn.className = 'reset-btn';
    resetBtn.textContent = 'คืนค่าเดิม';
    resetBtn.onclick = function () {
      resetField(field.id, statusEl, field.default, function (def) { textarea.value = def; });
    };
    row.appendChild(saveBtn);
    row.appendChild(resetBtn);
    row.appendChild(statusEl);
    wrap.appendChild(row);
  } else if (field.type === 'link') {
    var linkInput = document.createElement('input');
    linkInput.type = 'text';
    linkInput.value = current || '';
    linkInput.placeholder = 'https://...';
    wrap.appendChild(linkInput);

    var rowL = document.createElement('div');
    rowL.className = 'row';
    var saveBtnL = document.createElement('button');
    saveBtnL.className = 'save-btn';
    saveBtnL.textContent = 'บันทึก';
    saveBtnL.onclick = function () { saveField(field.id, linkInput.value.trim(), statusEl); };
    var resetBtnL = document.createElement('button');
    resetBtnL.className = 'reset-btn';
    resetBtnL.textContent = 'คืนค่าเดิม';
    resetBtnL.onclick = function () {
      resetField(field.id, statusEl, field.default, function (def) { linkInput.value = def; });
    };
    var testLink = document.createElement('a');
    testLink.className = 'test-link';
    testLink.textContent = 'ทดสอบลิงก์ ↗';
    testLink.target = '_blank';
    testLink.rel = 'noopener';
    testLink.href = current || '#';
    linkInput.addEventListener('input', function () { testLink.href = linkInput.value; });
    rowL.appendChild(saveBtnL);
    rowL.appendChild(resetBtnL);
    rowL.appendChild(testLink);
    rowL.appendChild(statusEl);
    wrap.appendChild(rowL);
  } else if (field.type === 'image') {
    var img = document.createElement('img');
    img.src = current;
    wrap.appendChild(img);

    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    var pendingValue = null;
    var sizeWarnEl = document.createElement('div');
    sizeWarnEl.style.fontSize = '.8rem';
    sizeWarnEl.style.marginTop = '6px';
    fileInput.onchange = function () {
      if (!fileInput.files[0]) return;
      resizeImage(fileInput.files[0], function (dataUrl, originalWidth) {
        pendingValue = dataUrl;
        img.src = dataUrl;
        var recMatch = field.hint && field.hint.match(/(\d+)×/);
        var recWidth = recMatch ? parseInt(recMatch[1], 10) : null;
        if (recWidth && originalWidth < recWidth) {
          sizeWarnEl.textContent = '⚠️ รูปที่เลือกกว้าง ' + originalWidth + 'px ซึ่งเล็กกว่าที่แนะนำ (' + recWidth + 'px) อาจแสดงผลเบลอ';
          sizeWarnEl.style.color = 'var(--red)';
        } else {
          sizeWarnEl.textContent = '✓ ขนาดรูปกว้าง ' + originalWidth + 'px ใช้ได้ดี';
          sizeWarnEl.style.color = '#1a7a3c';
        }
      });
    };
    wrap.appendChild(fileInput);
    wrap.appendChild(sizeWarnEl);

    var row2 = document.createElement('div');
    row2.className = 'row';
    var saveBtn2 = document.createElement('button');
    saveBtn2.className = 'save-btn';
    saveBtn2.textContent = 'บันทึกรูปนี้';
    saveBtn2.onclick = function () {
      if (!pendingValue) { statusEl.textContent = 'กรุณาเลือกรูปก่อน'; statusEl.className='status err'; return; }
      saveField(field.id, pendingValue, statusEl);
    };
    var resetBtn2 = document.createElement('button');
    resetBtn2.className = 'reset-btn';
    resetBtn2.textContent = 'คืนค่าเดิม';
    resetBtn2.onclick = function () {
      resetField(field.id, statusEl, field.default, function (def) { img.src = def; pendingValue = null; });
    };
    row2.appendChild(saveBtn2);
    row2.appendChild(resetBtn2);
    row2.appendChild(statusEl);
    wrap.appendChild(row2);
  }

  return wrap;
}

function showTab(name) {
  document.getElementById('contentTab').style.display = name === 'content' ? 'block' : 'none';
  document.getElementById('linksTab').style.display = name === 'links' ? 'block' : 'none';
  document.getElementById('creatorTab').style.display = name === 'creator' ? 'block' : 'none';
  document.getElementById('galleryTab').style.display = name === 'gallery' ? 'block' : 'none';
  document.getElementById('blogTab').style.display = name === 'blog' ? 'block' : 'none';
  document.getElementById('leadsTab').style.display = name === 'leads' ? 'block' : 'none';
  document.getElementById('statsTab').style.display = name === 'stats' ? 'block' : 'none';
  document.getElementById('tabContentBtn').className = name === 'content' ? 'active' : '';
  document.getElementById('tabLinksBtn').className = name === 'links' ? 'active' : '';
  document.getElementById('tabCreatorBtn').className = name === 'creator' ? 'active' : '';
  document.getElementById('tabGalleryBtn').className = name === 'gallery' ? 'active' : '';
  document.getElementById('tabBlogBtn').className = name === 'blog' ? 'active' : '';
  document.getElementById('tabLeadsBtn').className = name === 'leads' ? 'active' : '';
  document.getElementById('tabStatsBtn').className = name === 'stats' ? 'active' : '';
  if (name === 'stats') loadStats();
  if (name === 'links') loadLinksManager();
  if (name === 'creator') loadCreatorManager();
  if (name === 'gallery') loadGalleryManager();
  if (name === 'blog') loadBlogManager();
  if (name === 'leads') loadLeadsManager();
}

var leadsData = null;

function loadLeadsManager() {
  var el = document.getElementById('leadsTab');
  el.innerHTML = '<div class="group">กำลังโหลด...</div>';
  fetch('/api/leads', { headers: { 'x-admin-password': PASSWORD } })
    .then(function (res) { return res.json(); })
    .then(function (items) {
      leadsData = items || [];
      renderLeadsManager();
    })
    .catch(function () { el.innerHTML = '<div class="group">โหลดข้อมูลไม่สำเร็จ</div>'; });
}

function formatLeadDate(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  var months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var pad = function (n) { return n < 10 ? '0' + n : n; };
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + (d.getFullYear() + 543) + ' เวลา ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' น.';
}

function renderLeadsManager() {
  var el = document.getElementById('leadsTab');
  el.innerHTML = '';

  var infoBox = document.createElement('div');
  infoBox.className = 'group';
  infoBox.innerHTML = '<p style="margin:0;color:var(--muted);font-size:.9rem;">ข้อความที่ลูกค้าส่งผ่านแบบฟอร์มในหน้า <a href="/contact.html" target="_blank">/contact.html</a></p>';
  el.appendChild(infoBox);

  var listGroup = document.createElement('div');
  listGroup.className = 'group';
  var h2 = document.createElement('h2');
  h2.textContent = 'ข้อความติดต่อ (' + leadsData.length + ')';
  listGroup.appendChild(h2);

  if (!leadsData.length) {
    var emptyP = document.createElement('p');
    emptyP.style.color = 'var(--muted)';
    emptyP.textContent = 'ยังไม่มีข้อความเข้ามาครับ';
    listGroup.appendChild(emptyP);
  }

  leadsData.slice().reverse().forEach(function (lead) {
    var row = document.createElement('div');
    row.className = 'field';
    row.style.background = '#faf7f2';
    row.style.borderRadius = '10px';
    row.style.padding = '14px';
    row.style.marginBottom = '12px';

    var top = document.createElement('div');
    top.style.display = 'flex';
    top.style.justifyContent = 'space-between';
    top.style.flexWrap = 'wrap';
    top.style.gap = '8px';
    top.style.marginBottom = '8px';
    var nameEl = document.createElement('strong');
    nameEl.textContent = lead.name + (lead.phone ? ' — ' + lead.phone : '');
    var dateEl = document.createElement('span');
    dateEl.className = 'status';
    dateEl.textContent = formatLeadDate(lead.submittedAt);
    top.appendChild(nameEl);
    top.appendChild(dateEl);
    row.appendChild(top);

    var msgEl = document.createElement('p');
    msgEl.style.margin = '0 0 10px';
    msgEl.style.whiteSpace = 'pre-wrap';
    msgEl.textContent = lead.message;
    row.appendChild(msgEl);

    var delBtn = document.createElement('button');
    delBtn.className = 'reset-btn';
    delBtn.textContent = '🗑 ลบข้อความนี้';
    delBtn.onclick = function () {
      fetch('/api/leads', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': PASSWORD },
        body: JSON.stringify({ id: lead.id })
      }).then(function (res) { return res.json(); })
        .then(function (json) {
          if (json && json.ok) {
            leadsData = leadsData.filter(function (l) { return l.id !== lead.id; });
            renderLeadsManager();
          }
        });
    };
    row.appendChild(delBtn);

    listGroup.appendChild(row);
  });

  el.appendChild(listGroup);
}

var blogData = null;

function loadBlogManager() {
  var el = document.getElementById('blogTab');
  if (blogData) { renderBlogManager(); return; }
  el.innerHTML = '<div class="group">กำลังโหลด...</div>';
  fetch('/api/blog', { cache: 'no-store' })
    .then(function (res) { return res.json(); })
    .then(function (items) {
      blogData = items && items.length ? items : [];
      renderBlogManager();
    })
    .catch(function () { el.innerHTML = '<div class="group">โหลดข้อมูลไม่สำเร็จ</div>'; });
}

function renderBlogManager() {
  var el = document.getElementById('blogTab');
  el.innerHTML = '';

  var infoBox = document.createElement('div');
  infoBox.className = 'group';
  infoBox.innerHTML = '<p style="margin:0;color:var(--muted);font-size:.9rem;">จัดการบทความที่แสดงในหน้า <a href="/blog.html" target="_blank">/blog.html</a> และการ์ดแนะนำในหน้า <a href="/about.html" target="_blank">/about.html</a> — เพิ่ม/ลบ/แก้ได้อิสระ เนื้อหาขึ้นย่อหน้าใหม่ให้เว้นบรรทัดว่าง 1 บรรทัด<br>แต่ละบทความมีลิงก์ของตัวเอง (/blog/ตาม Slug ที่ตั้ง) พร้อม SEO meta tags และ sitemap.xml อัปเดตให้อัตโนมัติทุกครั้งที่บันทึก</p>';
  el.appendChild(infoBox);

  var listGroup = document.createElement('div');
  listGroup.className = 'group';
  var h2 = document.createElement('h2');
  h2.textContent = 'บทความทั้งหมด (' + blogData.length + ')';
  listGroup.appendChild(h2);

  blogData.forEach(function (post, idx) {
    listGroup.appendChild(renderBlogRow(post, idx));
  });

  var addBtn = document.createElement('button');
  addBtn.className = 'save-btn';
  addBtn.style.marginTop = '14px';
  addBtn.textContent = '+ เพิ่มบทความใหม่';
  addBtn.onclick = function () {
    var newId = 'post-' + Date.now();
    blogData.push({
      id: newId, slug: newId, title: 'หัวข้อบทความใหม่', date: new Date().toISOString().slice(0, 10),
      coverImage: '', excerpt: 'คำโปรยย่อ', body: 'เนื้อหาบทความ', sourceUrl: '', sourceName: ''
    });
    renderBlogManager();
  };
  listGroup.appendChild(addBtn);

  var saveRow = document.createElement('div');
  saveRow.style.marginTop = '18px';
  var saveAllBtn = document.createElement('button');
  saveAllBtn.className = 'save-btn';
  saveAllBtn.textContent = '💾 บันทึกการเปลี่ยนแปลงทั้งหมด';
  var statusEl = document.createElement('span');
  statusEl.className = 'status';
  statusEl.style.marginLeft = '10px';
  saveAllBtn.onclick = function () {
    statusEl.textContent = 'กำลังบันทึก...';
    statusEl.className = 'status';
    fetch('/api/blog', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': PASSWORD },
      body: JSON.stringify({ items: blogData })
    }).then(function (res) {
      if (res.status === 401) {
        statusEl.textContent = 'รหัสผ่านไม่ถูกต้อง กรุณาโหลดหน้านี้ใหม่';
        statusEl.className = 'status err';
        return;
      }
      return res.json();
    }).then(function (json) {
      if (json && json.ok) {
        statusEl.textContent = 'บันทึกแล้ว ✓ (หน้าบทความจะอัปเดตทันที)';
        statusEl.className = 'status ok';
      }
    }).catch(function () {
      statusEl.textContent = 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';
      statusEl.className = 'status err';
    });
  };
  saveRow.appendChild(saveAllBtn);
  saveRow.appendChild(statusEl);
  listGroup.appendChild(saveRow);

  el.appendChild(listGroup);
}

function renderBlogRow(post, idx) {
  var row = document.createElement('div');
  row.className = 'field';
  row.style.background = '#faf7f2';
  row.style.borderRadius = '10px';
  row.style.padding = '14px';
  row.style.marginBottom = '12px';

  function makeField(labelText, value, onChange, placeholder) {
    var wrap = document.createElement('div');
    wrap.style.marginBottom = '8px';
    var label = document.createElement('label');
    label.textContent = labelText;
    label.style.fontSize = '.78rem';
    label.style.fontWeight = '600';
    label.style.display = 'block';
    label.style.marginBottom = '3px';
    var input = document.createElement('input');
    input.type = 'text';
    input.value = value || '';
    if (placeholder) input.placeholder = placeholder;
    input.oninput = function () { onChange(input.value); };
    wrap.appendChild(label);
    wrap.appendChild(input);
    return wrap;
  }

  row.appendChild(makeField('หัวข้อบทความ', post.title, function (v) { post.title = v; }, 'หัวข้อบทความ'));
  row.appendChild(makeField('Slug (ใช้ตัวอักษรอังกฤษ ตัวเลข และ - เท่านั้น — เป็นส่วนหนึ่งของลิงก์บทความ /blog/slug)', post.slug, function (v) { post.slug = v; }, 'เช่น my-article-title'));
  row.appendChild(makeField('วันที่ (YYYY-MM-DD)', post.date, function (v) { post.date = v; }, '2026-01-01'));

  var imgLabel = document.createElement('label');
  imgLabel.textContent = 'รูปปก';
  imgLabel.style.fontSize = '.78rem';
  imgLabel.style.fontWeight = '600';
  imgLabel.style.display = 'block';
  imgLabel.style.marginBottom = '3px';
  row.appendChild(imgLabel);
  if (post.coverImage) {
    var preview = document.createElement('img');
    preview.src = post.coverImage;
    preview.style.maxWidth = '220px';
    preview.style.maxHeight = '140px';
    preview.style.objectFit = 'cover';
    preview.style.borderRadius = '8px';
    preview.style.display = 'block';
    preview.style.marginBottom = '8px';
    row.appendChild(preview);
  }
  var fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.style.marginBottom = '8px';
  fileInput.onchange = function () {
    if (!fileInput.files[0]) return;
    resizeImage(fileInput.files[0], function (dataUrl) {
      post.coverImage = dataUrl;
      renderBlogManager();
    });
  };
  row.appendChild(fileInput);

  row.appendChild(makeField('คำโปรยย่อ', post.excerpt, function (v) { post.excerpt = v; }, 'คำโปรยสั้น ๆ ใต้หัวข้อ'));

  var bodyWrap = document.createElement('div');
  bodyWrap.style.marginBottom = '8px';
  var bodyLabel = document.createElement('label');
  bodyLabel.textContent = 'เนื้อหาบทความ (เว้นบรรทัดว่างเพื่อขึ้นย่อหน้าใหม่)';
  bodyLabel.style.fontSize = '.78rem';
  bodyLabel.style.fontWeight = '600';
  bodyLabel.style.display = 'block';
  bodyLabel.style.marginBottom = '3px';
  var bodyTextarea = document.createElement('textarea');
  bodyTextarea.value = post.body || '';
  bodyTextarea.style.minHeight = '160px';
  bodyTextarea.style.width = '100%';
  bodyTextarea.style.padding = '10px';
  bodyTextarea.style.borderRadius = '8px';
  bodyTextarea.style.border = '1px solid #ddd';
  bodyTextarea.style.fontFamily = 'inherit';
  bodyTextarea.oninput = function () { post.body = bodyTextarea.value; };
  bodyWrap.appendChild(bodyLabel);
  bodyWrap.appendChild(bodyTextarea);
  row.appendChild(bodyWrap);

  row.appendChild(makeField('ลิงก์ต้นฉบับ (ไม่บังคับ)', post.sourceUrl, function (v) { post.sourceUrl = v; }, 'https://...'));
  row.appendChild(makeField('ชื่อสื่อ/แหล่งที่มา (ไม่บังคับ)', post.sourceName, function (v) { post.sourceName = v; }, 'เช่น MGR Online'));

  var previewLink = document.createElement('a');
  previewLink.href = '/blog/' + encodeURIComponent(post.slug || post.id);
  previewLink.target = '_blank';
  previewLink.rel = 'noopener';
  previewLink.className = 'test-link';
  previewLink.textContent = 'ดูตัวอย่างบทความ ↗';
  previewLink.style.display = 'inline-block';
  previewLink.style.marginBottom = '8px';
  row.appendChild(previewLink);
  row.appendChild(document.createElement('br'));

  var delBtn = document.createElement('button');
  delBtn.className = 'reset-btn';
  delBtn.textContent = '🗑 ลบบทความนี้';
  delBtn.onclick = function () {
    var i = blogData.indexOf(post);
    if (i > -1) blogData.splice(i, 1);
    renderBlogManager();
  };
  row.appendChild(delBtn);

  return row;
}

var GALLERY_DEFS = [
  { name: 'menu-fullcover', label: 'รูปเมนูฉบับเต็ม (ภาพใหญ่ใต้ปุ่มดาวน์โหลดเมนู — menu.html)', pageUrl: '/menu.html' },

  { name: 'reviews', label: 'แกลเลอรี่รูปภาพหน้ารีวิว (reviews.html)', pageUrl: '/reviews.html' }
];
var galleryData = {};

function loadGalleryManager() {
  var el = document.getElementById('galleryTab');
  if (Object.keys(galleryData).length) { renderGalleryTab(); return; }
  el.innerHTML = '<div class="group">กำลังโหลด...</div>';
  Promise.all(GALLERY_DEFS.map(function (def) {
    return fetch('/api/gallery?name=' + def.name, { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (items) { galleryData[def.name] = (items && items.length) ? items : []; });
  })).then(renderGalleryTab)
    .catch(function () { el.innerHTML = '<div class="group">โหลดข้อมูลไม่สำเร็จ</div>'; });
}

function saveGallerySection(name) {
  var statusEl = document.getElementById('gallery-status-' + name);
  if (!statusEl) return;
  statusEl.textContent = 'กำลังบันทึก...';
  statusEl.className = 'status';
  fetch('/api/gallery', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-password': PASSWORD },
    body: JSON.stringify({ name: name, items: galleryData[name] })
  }).then(function (res) {
    if (res.status === 401) {
      statusEl.textContent = 'รหัสผ่านไม่ถูกต้อง กรุณาโหลดหน้านี้ใหม่';
      statusEl.className = 'status err';
      return;
    }
    return res.json();
  }).then(function (json) {
    if (json && json.ok) {
      statusEl.textContent = 'บันทึกแล้ว ✓';
      statusEl.className = 'status ok';
    }
  }).catch(function () {
    statusEl.textContent = 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';
    statusEl.className = 'status err';
  });
}

function renderGalleryTab() {
  var el = document.getElementById('galleryTab');
  el.innerHTML = '';

  var infoBox = document.createElement('div');
  infoBox.className = 'group';
  infoBox.innerHTML = '<p style="margin:0;color:var(--muted);font-size:.9rem;">เพิ่ม/ลบรูปในแกลเลอรี่ได้อิสระ ไม่จำกัดจำนวน — อัปโหลดแล้วบันทึกทันที ระบบจะปรับขนาดรูปให้อัตโนมัติ</p>';
  el.appendChild(infoBox);

  GALLERY_DEFS.forEach(function (def) {
    var group = document.createElement('div');
    group.className = 'group';
    var h2 = document.createElement('h2');
    h2.textContent = def.label + ' (' + galleryData[def.name].length + ' รูป)';
    group.appendChild(h2);

    var grid = document.createElement('div');
    grid.className = 'gallery-grid';

    galleryData[def.name].forEach(function (src, idx) {
      var thumb = document.createElement('div');
      thumb.className = 'gallery-thumb';
      var img = document.createElement('img');
      img.src = src;
      thumb.appendChild(img);
      var delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.textContent = '✕';
      delBtn.onclick = function () {
        galleryData[def.name].splice(idx, 1);
        renderGalleryTab();
        saveGallerySection(def.name);
      };
      thumb.appendChild(delBtn);
      grid.appendChild(thumb);
    });

    var addTile = document.createElement('div');
    addTile.className = 'gallery-add-tile';
    addTile.innerHTML = '+ เพิ่มรูป';
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.onchange = function () {
      if (!fileInput.files[0]) return;
      resizeImage(fileInput.files[0], function (dataUrl) {
        galleryData[def.name].push(dataUrl);
        renderGalleryTab();
        saveGallerySection(def.name);
      });
    };
    addTile.appendChild(fileInput);
    grid.appendChild(addTile);

    var statusEl = document.createElement('span');
    statusEl.className = 'status';
    statusEl.id = 'gallery-status-' + def.name;

    group.appendChild(grid);
    group.appendChild(statusEl);
    el.appendChild(group);
  });
}

function renderLinkRow(item, idx) {
  var row = document.createElement('div');
  row.className = 'field';
  row.style.background = '#faf7f2';
  row.style.borderRadius = '10px';
  row.style.padding = '14px';
  row.style.marginBottom = '12px';

  function makeField(labelText, value, onChange, placeholder) {
    var wrap = document.createElement('div');
    wrap.style.marginBottom = '8px';
    var label = document.createElement('label');
    label.textContent = labelText;
    label.style.fontSize = '.78rem';
    label.style.fontWeight = '600';
    label.style.display = 'block';
    label.style.marginBottom = '3px';
    var input = document.createElement('input');
    input.type = 'text';
    input.value = value || '';
    if (placeholder) input.placeholder = placeholder;
    input.oninput = function () { onChange(input.value); };
    wrap.appendChild(label);
    wrap.appendChild(input);
    return wrap;
  }

  row.appendChild(makeField('หัวข้อกลุ่ม (Section)', item.section, function (v) { item.section = v; }, 'เช่น ℹ️ Information'));
  row.appendChild(makeField('หัวข้อย่อย (ไม่บังคับ เช่น ชื่อสาขา)', item.subtitle, function (v) { item.subtitle = v; }, 'เว้นว่างได้'));

  var iconWrap = document.createElement('div');
  iconWrap.style.marginBottom = '8px';
  var iconLabel = document.createElement('label');
  iconLabel.textContent = 'ไอคอน';
  iconLabel.style.fontSize = '.78rem';
  iconLabel.style.fontWeight = '600';
  iconLabel.style.display = 'block';
  iconLabel.style.marginBottom = '3px';
  var iconSelect = document.createElement('select');
  iconSelect.style.width = '100%';
  iconSelect.style.padding = '10px';
  iconSelect.style.borderRadius = '8px';
  iconSelect.style.border = '1px solid #ddd';
  ICON_OPTIONS.forEach(function (opt) {
    var o = document.createElement('option');
    o.value = opt;
    o.textContent = opt;
    if (item.icon === opt) o.selected = true;
    iconSelect.appendChild(o);
  });
  iconSelect.onchange = function () { item.icon = iconSelect.value; };
  iconWrap.appendChild(iconLabel);
  iconWrap.appendChild(iconSelect);
  row.appendChild(iconWrap);

  row.appendChild(makeField('ข้อความปุ่ม (Label)', item.label, function (v) { item.label = v; }, 'เช่น Lineman - บรรทัดทอง'));
  row.appendChild(makeField('URL ปลายทาง', item.url, function (v) { item.url = v; }, 'https://...'));

  var delBtn = document.createElement('button');
  delBtn.className = 'reset-btn';
  delBtn.textContent = '🗑 ลบลิงก์นี้';
  delBtn.onclick = function () {
    var i = linksData.indexOf(item);
    if (i > -1) linksData.splice(i, 1);
    renderLinksManager();
  };
  row.appendChild(delBtn);

  return row;
}

function labelFor(id) {

  var m = id.match(/^map-branch-(\d)$/);
  if (m) return 'แผนที่ - ' + BRANCH_NAMES[m[1]];
  m = id.match(/^delivery-branch-(\d)-(.+)$/);
  if (m) return 'เดลิเวอรี่ ' + m[2].charAt(0).toUpperCase() + m[2].slice(1) + ' - ' + BRANCH_NAMES[m[1]];

function loadStats() {
  var el = document.getElementById('statsTab');
  el.innerHTML = '<div class="group">กำลังโหลด...</div>';
  fetch('/api/analytics', { headers: { 'x-admin-password': PASSWORD } })
    .then(function (res) { return res.json(); })
    .then(function (counts) {
      var entries = Object.keys(counts).map(function (id) { return { id: id, count: counts[id] }; });
      entries.sort(function (a, b) { return b.count - a.count; });
      var max = entries.length ? entries[0].count : 1;
      var html = '<div class="group"><h2>ลิงก์ที่ถูกคลิกมากที่สุด</h2>';
      if (!entries.length) {
        html += '<p style="color:var(--muted)">ยังไม่มีข้อมูลการคลิก — จะเริ่มเก็บสถิติทันทีที่มีลูกค้าคลิกลิงก์บนเว็บ</p>';
      } else {
        html += '<table class="stats"><thead><tr><th>ลิงก์</th><th style="text-align:right">จำนวนคลิก</th></tr></thead><tbody>';
        entries.forEach(function (e) {
          html += '<tr><td>' + labelFor(e.id) + '<div class="bar-bg"><div class="bar-fill" style="width:' + Math.round(e.count / max * 100) + '%"></div></div></td><td class="count">' + e.count + '</td></tr>';
        });
        html += '</tbody></table>';
      }
      html += '</div>';
      el.innerHTML = html;
    })
    .catch(function () { el.innerHTML = '<div class="group">โหลดข้อมูลไม่สำเร็จ</div>'; });
}

function getPageMeta(groupName) {
  for (var i = 0; i < PAGE_META.length; i++) {
    if (PAGE_META[i].test(groupName)) return PAGE_META[i];
  }
  return { icon: '📄', color: '#999999', label: groupName };
}

function shortGroupLabel(groupName, meta) {
  var prefix = meta.label + ' - ';
  if (groupName.indexOf(prefix) === 0) return groupName.slice(prefix.length);
  var m = groupName.match(/^สาขา\s+(.+)$/);
  if (m) return m[1];
  return groupName;
}

function toggleGroup(groupId, forceOpen) {
  var el = document.getElementById(groupId);
  if (!el) return;
  if (forceOpen) el.classList.add('open');
  else el.classList.toggle('open');
}

function filterContent(query) {
  query = (query || '').trim().toLowerCase();
  var groupEls = document.querySelectorAll('#contentGroups .group');
  var sidebarLinks = document.querySelectorAll('#contentSidebar .sidebar-link');
  var matchedIds = {};
  groupEls.forEach(function (el) {
    var text = el.getAttribute('data-search-text') || '';
    var match = !query || text.indexOf(query) > -1;
    el.style.display = match ? '' : 'none';
    if (match && query) { el.classList.add('open'); matchedIds[el.id] = true; }
  });
  sidebarLinks.forEach(function (link) {
    var target = link.getAttribute('data-target');
    var text = (link.textContent || '').toLowerCase();
    var groupMatch = !query || (document.getElementById(target) && document.getElementById(target).style.display !== 'none');
    link.parentElement.style.display = groupMatch ? '' : 'none';
  });
}

function render() {
  var app = document.getElementById('contentTab');
  app.innerHTML = '';

  var toolbar = document.createElement('div');
  toolbar.className = 'content-toolbar';
  var searchInput = document.createElement('input');
  searchInput.type = 'text';
  searchInput.id = 'contentSearch';
  searchInput.placeholder = '🔍 ค้นหาหัวข้อที่ต้องการแก้ไข เช่น "โปรโมชั่น", "เบอร์โทร", "รูปสาขา"';
  searchInput.oninput = function () { filterContent(searchInput.value); };
  toolbar.appendChild(searchInput);
  app.appendChild(toolbar);

  var layout = document.createElement('div');
  layout.className = 'content-layout';

  var sidebar = document.createElement('nav');
  sidebar.className = 'content-sidebar';
  sidebar.id = 'contentSidebar';

  var groupsWrap = document.createElement('div');
  groupsWrap.className = 'content-groups';
  groupsWrap.id = 'contentGroups';

  var groups = {};
  var groupOrder = [];
  manifest.forEach(function (f) {
    if (!groups[f.group]) { groups[f.group] = []; groupOrder.push(f.group); }
    groups[f.group].push(f);
  });

  var lastPageLabel = null;
  var sidebarList = document.createElement('ul');
  sidebarList.className = 'sidebar-list';

  groupOrder.forEach(function (groupName, idx) {
    var meta = getPageMeta(groupName);
    var groupId = 'group-' + idx;

    if (meta.label !== lastPageLabel) {
      var pageHeadLi = document.createElement('li');
      pageHeadLi.className = 'sidebar-page-head';
      pageHeadLi.innerHTML = '<span class="sidebar-page-icon">' + meta.icon + '</span> ' + meta.label;
      pageHeadLi.style.borderLeftColor = meta.color;
      sidebarList.appendChild(pageHeadLi);
      lastPageLabel = meta.label;
    }

    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = 'javascript:void(0)';
    a.className = 'sidebar-link';
    a.setAttribute('data-target', groupId);
    a.textContent = shortGroupLabel(groupName, meta);
    a.onclick = function () {
      toggleGroup(groupId, true);
      document.getElementById(groupId).scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    li.appendChild(a);
    sidebarList.appendChild(li);

    var section = document.createElement('div');
    section.className = 'group';
    section.id = groupId;
    section.style.borderLeftColor = meta.color;

    var searchTextParts = [groupName];
    groups[groupName].forEach(function (f) { searchTextParts.push(f.label); });
    section.setAttribute('data-search-text', searchTextParts.join(' ').toLowerCase());

    var header = document.createElement('div');
    header.className = 'group-header';
    header.onclick = function () { toggleGroup(groupId); };
    header.innerHTML = '<span class="group-icon">' + meta.icon + '</span><h2>' + groupName + '</h2><span class="chevron">▾</span>';
    section.appendChild(header);

    var body = document.createElement('div');
    body.className = 'group-body';
    groups[groupName].forEach(function (field) {
      body.appendChild(renderField(field));
    });
    section.appendChild(body);

    groupsWrap.appendChild(section);
  });

  sidebar.appendChild(sidebarList);
  layout.appendChild(sidebar);
  layout.appendChild(groupsWrap);
  app.appendChild(layout);
}

function boot() {
  Promise.all([
    fetch('/content-manifest.json').then(function (r) { return r.json(); }),
    fetch('/api/content', { cache: 'no-store' }).then(function (r) { return r.json(); })
  ]).then(function (results) {
    manifest = results[0];
    overrides = results[1];

    // fetch default values from the live pages by reading data-cms-id defaults embedded below
    var defaults = window.__KOONGTUNG_DEFAULTS__ || {};
    manifest.forEach(function (f) { f.default = defaults[f.id] !== undefined ? defaults[f.id] : (f.type === 'image' ? '' : ''); });

    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    render();
  }).catch(function () {
    document.getElementById('gateMsg').textContent = 'โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้านี้';
  });
}
